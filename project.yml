name: RJGoviiProxy
options:
  bundleIdPrefix: com.govindmaurya
  deploymentTarget:
    iOS: "16.0"
targets:
  RJGoviiProxy:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.govindmaurya.rjgovii-proxy
        PRODUCT_NAME: RJ GOVII PROXY
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
