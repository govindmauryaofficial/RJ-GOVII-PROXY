name: Build unsigned iOS app

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app for iOS device
        run: |
          xcodebuild \
            -project RJGoviiProxy.xcodeproj \
            -scheme RJGoviiProxy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify app and embedded Packet Tunnel extension
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/RJ GOVII PROXY.app"
          EXT_PATH="$APP_PATH/PlugIns/RJGoviiPacketTunnel.appex"
          test -d "$APP_PATH"
          test -d "$EXT_PATH"
          APP_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          EXT_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT_PATH/Info.plist")
          test "$APP_BUNDLE_ID" = "com.govindmaurya.rjgovii-proxy"
          test "$EXT_BUNDLE_ID" = "com.govindmaurya.rjgovii-proxy.PacketTunnel"
          echo "Verified app bundle: $APP_BUNDLE_ID"
          echo "Verified embedded extension: $EXT_BUNDLE_ID"
          echo "Main app entitlement source: Sources/RJGoviiProxy.entitlements"
          echo "Extension entitlement source: PacketTunnel/PacketTunnel.entitlements"

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/RJ GOVII PROXY.app"
          test -d "$APP_PATH/PlugIns/RJGoviiPacketTunnel.appex"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          cd Payload/..
          zip -r RJ-GOVII-PROXY-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RJ-GOVII-PROXY-unsigned-IPA
          path: RJ-GOVII-PROXY-unsigned.ipa
          if-no-files-found: error
